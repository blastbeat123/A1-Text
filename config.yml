# File di configurazione per il Word Processor

ui_settings:
  sound_enabled_on_startup: false
  # ⏎  U+23CE - Return Symbol
  # ↩  U+21A9 - Leftwards Arrow with Hook
  # ⎆  U+2386 - Enter Symbol
  # ⮐  U+2B90 - Return Left
  # ⌤  U+2324 - Up Arrowhead Between Two Horizontal Bars
  # ↵  U+21B5 - Default
  # Il simbolo da usare per rappresentare il tasto Invio.
  # Usa virgolette per assicurare che venga letto come stringa.
  enter_symbol: "\u21B5"

  # Lingua interfaccia utente
  # Valori supportati:
  # en → English (default)
  # it → Italiano
  language: en

  # Font per i menu e le finestre di dialogo (popover)
  # Assicurati di usare un nome di font installato sul tuo sistema.
  menu_font_family: "JetBrains Mono"

  # Dimensione del font per i menu (solo il numero). L'unità 'pt' verrà aggiunta dal codice.
  menu_font_size: 10

  # Font predefinito per l'area di testo principale all'avvio.
  # Assicurati di usare un nome di font installato sul tuo sistema.
  editor_font_family: "IBM Plex Mono"

  # Dimensione predefinita del font per l'area di testo.
  editor_font_size: 13

google_api:
  api_key: "ENTER YOUR API KEY HERE"
  url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent"
  model: "Gemini-3-flash-preview"

groq_api:
  api_key: "ENTER YOUR API KEY HERE"
  url: "https://api.groq.com/openai/v1/chat/completions"
  model: "llama-3.3-70b-versatile"

ai_prompts:
  # Prompt inviati all'AI — modificare per cambiare lingua o stile dell'istruzione.
  # Le etichette dei menu si trovano invece nei file locales/ (es. it.yml).

  # synonym
  sinonimo_prompt:    "Find a synonym for the following word/phrase:"
  # improve
  migliora_prompt:    "Improve the following text making it clearer and more fluent:"
  # rewrite
  riscrivi_prompt:    "Rewrite the following text differently, keeping the same meaning:"
  # enrich
  arricchisci_prompt: "Enrich the following text adding details and making it more descriptive:"
  #
  default_prompt:     "Process the following text:"


languagetool:
  # La porta su cui il server LanguageTool si metterà in ascolto.
  port: 8081

  # Inserisci qui il percorso della directory di installazione di LanguageTool.
  path: "/usr/share/languagetool"

  # Lingua per il controllo grammaticale
  # en-US  → Inglese americano  Default
  # en-GB  → Inglese britannico
  # Italiano it
  # Francese fr
  # Tedesco  de-DE
  # Spagnolo es
  # Portoghese pt-PT  → Portogallo pt-BR  → Brasile
  # Olandese nl
  # Polacco pl
  # Russo ru
  #
  language: en-US
